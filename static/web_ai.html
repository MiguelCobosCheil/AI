<!DOCTYPE html>
<html>
<head>
    <title>AI Agent</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h1>🤖 Agente IA</h1>

<textarea id="prompt" placeholder="Ej: Busca Samsung S26 Ultra en Google y dime en qué posición aparece samsung.com"></textarea>

<br>
<button onclick="ejecutar()">🚀 Ejecutar</button>

<pre id="resultado"></pre>

<script>

async function ejecutar(){

    const prompt = document.getElementById("prompt").value;

    const res = await fetch("/web/agent/ai", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt })
    });

    const data = await res.json();

    document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
