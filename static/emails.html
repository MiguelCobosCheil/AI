<!DOCTYPE html>
<html>
<head>
    <title>Email Analyzer</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #loader {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #resultado {
            margin-top: 20px;
            background: #f5f5f5;
            padding: 10px;
            max-height: 500px;
            overflow: auto;
        }
    </style>
</head>

<body>

<h2>Email Analyzer</h2>

<button onclick="volver()">⬅ Volver</button>
<button id="btnAnalizar" onclick="analizar()">Analizar emails</button>
<select id="selectorRegla">
    <option value="">Sin regla</option>
</select>
<p id="estado"></p>

<div id="loader">
    <div class="spinner"></div>
    <span> Analizando emails...</span>
</div>

<pre id="resultado"></pre>

<script>

function volver(){
    window.location.href = "/folder"
}
async function analizar(){

    const btn = document.getElementById("btnAnalizar")

    document.getElementById("estado").innerText = "⏳ Analizando..."
    document.getElementById("resultado").innerText = ""
    document.getElementById("loader").style.display = "block"

    btn.disabled = true
    btn.innerText = "Procesando..."

    try {

        const reglaId = document.getElementById("selectorRegla").value;

        let url = "/acciones";
        if (reglaId) {
            url += `?regla_id=${reglaId}`;
        }

        let res = await fetch(url);
        let data = await res.json()

        // 🔥 SI NO LOGIN → REDIRIGE
        if (data.error === "NO_AUTH") {
            window.location.href = "/login"
            return
        }

        document.getElementById("estado").innerText = "✅ Terminado"
        document.getElementById("resultado").innerText =
            JSON.stringify(data, null, 2)

    } catch (error) {

        document.getElementById("estado").innerText = "❌ Error"
        document.getElementById("resultado").innerText = error

        console.error(error)
    }

    document.getElementById("loader").style.display = "none"
    btn.disabled = false
    btn.innerText = "Analizar emails"
}
</script>
<script>
async function cargarReglas() {
    const res = await fetch("/reglas");
    const reglas = await res.json();

    const select = document.getElementById("selectorRegla");

    reglas.forEach(r => {
        const option = document.createElement("option");
        option.value = r.id;
        option.textContent = r.nombre;
        select.appendChild(option);
    });

    // 🔥 CLAVE: recuperar regla guardada
    const guardada = localStorage.getItem("regla_id");
    if (guardada) {
        select.value = guardada;
    }
}

cargarReglas();
document.getElementById("selectorRegla").addEventListener("change", function(){
    localStorage.setItem("regla_id", this.value);
});
</script>
</body>
</html>
